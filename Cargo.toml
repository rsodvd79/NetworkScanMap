[package]
name = "network-scan-map"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
ipnet = { version = "2", features = ["serde"] }
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
snmp2 = { version = "0.5.3", default-features = false }
socket2 = { version = "0.6", features = ["all"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_Foundation"] }

