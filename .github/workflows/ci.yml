name: Build and release NetworkScanMap
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      timestamp: ${{ steps.release.outputs.timestamp }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Generate common UTC release timestamp
        id: release
        shell: bash
        run: |
          timestamp="$(date -u +'%Y.%m.%d.%H.%M')"
          echo "timestamp=$timestamp" >> "$GITHUB_OUTPUT"
          echo "tag=network-scan-map-${timestamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

  verify:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: macos
          - os: windows-latest
            artifact: windows
          - os: ubuntu-latest
            artifact: linux
    runs-on: ${{ matrix.os }}
    env:
      BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libegl1-mesa-dev libx11-dev libxi-dev libxcursor-dev libxrandr-dev pkg-config libssl-dev
      - run: cargo fmt --all -- --check
      - run: cargo test --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo build --release --locked
      - name: Package macOS/Linux release
        if: runner.os != 'Windows'
        run: zip -j "network-scan-map-${{ matrix.artifact }}.${BUILD_TIMESTAMP}.zip" target/release/network-scan-map
      - name: Package Windows release
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/release/network-scan-map.exe -DestinationPath "network-scan-map-${{ matrix.artifact }}.$env:BUILD_TIMESTAMP.zip"
      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.artifact }}
          path: network-scan-map-${{ matrix.artifact }}.${{ needs.prepare.outputs.timestamp }}.zip
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: [prepare, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          BUILD_TIMESTAMP: ${{ needs.prepare.outputs.timestamp }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" \
            "release-assets/network-scan-map-macos.${BUILD_TIMESTAMP}.zip" \
            "release-assets/network-scan-map-windows.${BUILD_TIMESTAMP}.zip" \
            "release-assets/network-scan-map-linux.${BUILD_TIMESTAMP}.zip" \
            --target "$COMMIT_SHA" \
            --title "NetworkScanMap ${BUILD_TIMESTAMP} (UTC)" \
            --generate-notes --latest
